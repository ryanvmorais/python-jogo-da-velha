# =============================================================================
# Configuração do projeto (PEP 621) — gerenciado com uv.
#
#   [project]                 metadados (projeto didático, só stdlib em runtime)
#   [dependency-groups] dev   ferramentas de qualidade (uv instala por padrão)
#   [tool.*]                  config de ruff, black, mypy e pytest
#
# As versões exatas do grupo dev ficam travadas no uv.lock (gerado por
# `uv lock`). Commite pyproject.toml e uv.lock juntos.
# =============================================================================

[project]
name = "jogo-da-velha"
version = "0.1.0"
description = "Jogo da Velha (Tic Tac Toe) em Python — exercício educacional de lógica, matrizes e POO."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ryan Morais" }]
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.uv]
# Script educacional, não uma lib a ser empacotada/instalada como pacote.
package = false

# --- Linter (substitui o flake8 + isort, lê o pyproject nativamente) ---
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade
select = ["E", "W", "F", "I", "UP"]

# --- Formatador ---
[tool.black]
line-length = 88
target-version = ["py312"]

# --- Type checker ---
[tool.mypy]
python_version = "3.12"
strict = true
files = ["main.py", "tests"]

# --- Testes ---
[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
